name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check (compile)
        run: python -m py_compile app.py
      - name: Lint with flake8
        run: flake8 .

  docker-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target base -t aceest-fitness:ci .
      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .
      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:test
